# Ambiente de desenvolvimento local: sobe apenas o MySQL.
# A API roda fora do Docker (uvicorn com reload) para agilizar o desenvolvimento.
# Uso: docker compose up -d

services:
  mysql:
    image: mysql:8.4
    container_name: logos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: logos
      MYSQL_USER: logos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-logos}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 3307 no host para não conflitar com um MySQL local na 3306
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
