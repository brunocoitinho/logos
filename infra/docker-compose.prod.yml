# Produção (VPS): Caddy (HTTPS) → API → MySQL.
#
# Uso, na pasta infra/ da VPS (com o arquivo .env preenchido a partir do .env.example):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Segurança de rede: o Docker grava regras próprias de firewall e IGNORA o ufw para portas
# publicadas. Por isso só o Caddy publica portas para a internet; API e MySQL ficam na
# rede interna do Docker.

# Nome diferente do compose de desenvolvimento (projeto "logos"), para nunca se misturarem.
name: logos-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: logos
      MYSQL_USER: logos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # Só no localhost da VPS: permite o DBeaver via túnel SSH, sem expor o banco à internet.
      - "127.0.0.1:${MYSQL_TUNNEL_PORT:-3307}:3306"
    healthcheck:
      # -h 127.0.0.1 força TCP. Com "localhost" o ping usa o socket e responde OK durante o
      # "servidor temporário" da 1ª inicialização, que não aceita TCP: a API subia cedo demais.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://logos:${MYSQL_PASSWORD}@mysql:3306/logos
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS no .env}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?defina API_DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados do Let's Encrypt persistem entre reinícios.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
